name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Lint (ruff)
        run: uv run --group dev ruff check .
      - name: Type check (mypy strict)
        run: uv run --group dev mypy

  campaign:
    name: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: >
          uv run --group dev pytest
          --cov-report=xml
          --html=report-py${{ matrix.python-version }}.html --self-contained-html
          --junitxml=junit-py${{ matrix.python-version }}.xml

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: report-py${{ matrix.python-version }}
          path: |
            report-py${{ matrix.python-version }}.html
            junit-py${{ matrix.python-version }}.xml
