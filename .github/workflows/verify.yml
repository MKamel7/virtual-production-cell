name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Lint (ruff)
        run: uv run --group dev ruff check .
      - name: Type check (mypy strict)
        run: uv run --group dev mypy

  campaign:
    name: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: >
          uv run --group dev pytest
          --cov-report=xml
          --html=report-py${{ matrix.python-version }}.html --self-contained-html
          --junitxml=junit-py${{ matrix.python-version }}.xml

      # The safety argument is rebuilt on every push rather than committed and
      # trusted. A traceability matrix that is only as current as the last time
      # someone remembered to regenerate it is not evidence of anything. This
      # exits non-zero on a gap in either direction: a requirement nobody tests,
      # or a test claiming a requirement that does not exist.
      - name: Rebuild the traceability matrix
        run: uv run --group dev python scripts/check_traceability.py

      # Same reasoning: a performance figure that is only as current as the last
      # time somebody remembered to rerun it is a memory, not a measurement.
      - name: Replay the scenarios and rebuild the OEE report
        run: uv run --group dev python scripts/run_scenarios.py

      # The generated matrix is committed too, so a reader of the repository can
      # see it without running anything. This catches the case where the
      # requirements or the markers change and the checked in report goes stale:
      # the diff is the failure message.
      - name: Redraw the diagrams
        run: uv run --group dev python scripts/render_diagrams.py

      - name: Fail if the committed matrix or the diagrams are stale
        run: |
          if ! git diff --quiet -- report/ docs/; then
            echo "::error::report/ or docs/ is out of date. Run scripts/check_traceability.py and scripts/render_diagrams.py, then commit."
            git --no-pager diff --stat -- report/ docs/
            git --no-pager diff -- report/
            exit 1
          fi

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: report-py${{ matrix.python-version }}
          path: |
            report-py${{ matrix.python-version }}.html
            junit-py${{ matrix.python-version }}.xml
            report/traceability.md
