[project]
name = "virtual-production-cell"
version = "0.1.0"
description = "Virtual commissioning of a packaging cell: IEC 61131-3 control against a simulated plant, PackML state model, OPC UA, and a safety channel carried over PROFIsafe framing"
requires-python = ">=3.10"

# Dependencies are added as the modules that need them land. The safety channel
# will import the protection layer from the fault injection harness, pinned to a
# tag and never to main: same discipline that project applies to its own device
# under test, and for the same reason.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/vpc"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-html>=4.0", "hypothesis>=6.100",
       "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --cov=src --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:",
                 "class .*\\(Protocol\\):", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py310"
# plc/codesys/build_project.py is not this project's Python. It runs inside the
# CODESYS IDE under IronPython 2.7, and the host injects `projects`, `DeviceID`
# and `KindOfTask` into its globals. Linting it against a py310 target reports
# only false positives: undefined names that are the host's API, and rewrites
# that IronPython would reject.
extend-exclude = ["plc/codesys/build_project.py", "plc/codesys/sync_program.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true
